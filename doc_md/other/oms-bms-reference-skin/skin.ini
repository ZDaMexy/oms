// =============================================================================
// OMS BMS reference skin (7K)
// =============================================================================
// Reproduces the built-in programmatic default look. Use it as a starting
// template: copy this folder into your skins directory, then edit the values
// you want to change.
//
// Notes for authors:
//   * Comments use //  (not ; ).
//   * Every key is OPTIONAL. Unset keys fall back to these same defaults
//     (fail-open), so a real custom skin only needs the keys it changes.
//   * Colours are R,G,B or R,G,B,A, each 0-255.
//   * Geometry pixel values are marked "px"; the rest are screen-relative
//     fractions or lane-relative ratios.
//   * Sections are bucketed per keymode. Other keymodes (5K / 9K / 14K) use the
//     same keys under their own [Bms] Keymode block; only the lane-count-derived
//     PlayfieldWidth default differs.
//   * Textures (NoteImage{lane}, LaneBackgroundImage{lane}, HitTargetImage,
//     LaneCoverTopImage, PlayfieldBackdropImage, ...) are intentionally omitted
//     here: the default look is fully programmatic. Add an image key to let a
//     file texture take over an element; with a texture present the file skin
//     owns that element's look and the colour keys below no longer tint it.
//   * This file is kept in lock-step with BmsReferenceSkinTest (the parity gate
//     that asserts every value below equals the real default).
// =============================================================================

[General]
Keymodes: 7K

[Bms]
Keymode: 7K

// --- Geometry ---
PlayfieldWidth: 0.396       // normalised lane-strip width (7K / 8-lane default; derived from lane count)
PlayfieldHeight: 0.92       // judgement line sits at 92% screen height; the gauge occupies the band below it
NormalLaneWidth: 1.0        // key-lane width (relative)
ScratchLaneWidth: 1.5       // scratch lane is 1.5x a key lane
NormalLaneSpacing: 0.0      // gap between adjacent key lanes (relative)
ScratchLaneSpacing: 0.12    // gap beside the scratch lane (relative)
HitTargetHeight: 16         // px — overall hit-target area height
HitTargetBarHeight: 12      // px — dark backing bar
HitTargetLineHeight: 3      // px — bright judgement line
HitTargetGlowRadius: 6      // px — glow around the judgement line
BarLineHeight: 2            // px — measure / beat bar line thickness
LongNoteBodyWidth: 0.5775   // long-note body width (relative to lane width)
// HitTargetVerticalOffset is intentionally NOT skinnable: it is locked at 0 to keep the
// scroll-length ratio at 1, which preserves green-number / judgement timing.

// --- Note colours (IIDX key-colour groups, not per-lane) ---
NoteColourWhite: 243,243,243
NoteColourCyan: 53,234,255
NoteColourYellow: 255,222,53
NoteColourScratch: 252,0,20

// --- Lane backgrounds / dividers ---
LaneBackgroundEvenColour: 24,30,45
LaneBackgroundOddColour: 28,34,50
ScratchLaneBackgroundColour: 40,29,20
LaneDividerColour: 88,102,128
ScratchLaneDividerColour: 220,170,100

// --- Hit target (judgement line) ---
HitTargetBarColour: 8,12,20,232
HitTargetLineColour: 238,243,251
HitTargetGlowColour: 120,196,255,172
ScratchHitTargetBarColour: 22,15,10,236
ScratchHitTargetLineColour: 255,198,116
ScratchHitTargetGlowColour: 255,186,104,172

// --- Bar lines ---
MajorBarLineColour: 214,224,243,182
MinorBarLineColour: 138,152,182,102

// --- Lane cover (Sudden / Hidden) ---
LaneCoverFillColour: 8,12,20
LaneCoverShadeColour: 19,26,39
LaneCoverFocusColour: 255,196,112

// --- Playfield shell ---
PlayfieldBackdropColour: 4,8,14     // flat backdrop shown only when the beatmap has no background image
PlayfieldBaseplateColour: 10,16,28  // opaque strip behind the lanes
